<section class="leadership" aria-labelledby="leadership-heading">
  <!-- Header -->
  <div class="leadership-header-layout">
    <header class="leadership-header">
      <h2 id="leadership-heading" class="leadership-title">Leadership Spotlight</h2>
      <p class="leadership-subtitle">
        Clinician-led founders with deep correctional and behavioral health experience who design and run our programs operations. This team balances operational reliability, and a genuinely supportive experience for every contractor we place.
      </p>
    </header>

    <figure class="leadership-header-media" aria-hidden="true">
      <img src="./src/assets/images/slaud-about.webp" alt="Leadership team collaborating"
        class="leadership-header-media-img" loading="lazy" />
      <figcaption class="leadership-media-caption">Founding team behind every placement decision.</figcaption>
    </figure>
  </div>

  <!-- Team Grid -->
  <ul class="leadership-grid grid" aria-label="Leadership team members">

    <!-- Staff Card - Igal Tarash -->
    <li>
      <article class="staff-card">
        <input type="checkbox" class="staff-card__toggle" id="staff-igal" aria-labelledby="staff-igal-label" />
        <label class="staff-card__inner" id="staff-igal-label" for="staff-igal">

          <!-- Front Face -->
          <div class="staff-card__face staff-card__face--front">
            <header class="staff-card__header">
              <div class="staff-card__avatar" aria-hidden="true">IT</div>
              <div class="staff-card__info">
                <h3 class="staff-card__name">Igal Tarash, D.O., MBA</h3>
                <p class="staff-card__role">Co-Founder &amp; Chief Executive Officer</p>
              </div>
            </header>
            <ul class="staff-card__highlights" aria-label="Igal Tarash highlights">
              <li>Psychiatry, behavioral medicine, and clinical research expertise.</li>
              <li>Deep correctional healthcare experience focused on operational reliability.</li>
              <li>Clinician + MBA leadership guiding strategic direction and partnerships.</li>
            </ul>
            <span class="staff-card__cta" aria-hidden="true">Get to know my story &rarr;</span>
          </div>

          <!-- Back Face -->
          <div class="staff-card__face staff-card__face--back">
            <!-- Visual close affordance; clicking anywhere on the card (label)
               still toggles the checkbox. This avoids multiple labels
               being associated with the same control. -->
            <div class="staff-card__back-content">
              <button type="button" class="staff-card__close" aria-label="Close details">&times;</button>

              <div class="staff-card__header">
                <img src="https://placehold.co/96x96/1e40af/ffffff?text=IT" alt="" class="staff-card__thumb"
                  loading="lazy" />
                <div class="staff-card__info">
                  <h3 class="staff-card__name">Igal Tarash, D.O., MBA</h3>
                  <p class="staff-card__role">Co-Founder &amp; Chief Executive Officer</p>
                </div>
              </div>

              <div class="staff-card__bio">
                <p>
                  Dr. Igal Tarash—many of his patients know him as Dr. T—is a multicultural, multilingual physician
                  with
                  specialized expertise in psychiatry, behavioral medicine, and clinical research. With years of
                  experience
                  in correctional healthcare systems, he has seen firsthand how staffing reliability directly influences
                  patient outcomes and operational performance.
                </p>
                <p>
                  He holds both an M.D. and an MBA, and leads Salud Clinical Solutions with a blend of clinical insight
                  and
                  organizational leadership. He oversees the strategic direction, builds client partnerships, and ensures
                  operational excellence across the organization.
                </p>
              </div>
            </div>
          </div>
        </label>
      </article>
    </li>
