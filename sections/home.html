<section id="home" class="hero" aria-labelledby="hero-title">
  <header class="hero-header">
    <h1 id="hero-title" class="hero-title">
      Connecting Behavioral and Mental Health providers with the roles that matter most.
    </h1>

    <div class="card card--hero">
      <p class="hero-subtitle">
        We specialize in behavioral and mental health locum tenens across California. From major metro areas to
        underserved communities, our team can help clinicians find the right fit.
      </p>

      <nav class="hero-actions" aria-label="Hero actions">
        <a class="btn btn-primary" href="#contact" rel="nofollow noreferrer">

        <a class="btn btn-secondary" href="#about" rel="nofollow noreferrer">

        </a>

    </div>

  <figure class="hero-media">
    <div class="hero-visual">
      <div class="hero-overlay-layer">
        <img class="hero-final-logo" src="./src/assets/images/active-logo-removebg-preview.webp"

            </svg>
            <span class="hero-replay-tooltip">Replay animation</span>

        </div>

      <div class="hero-map-layer">
